// =======================================================================================
// Pure (纯净对抗) Shared Plugins - the ONLY plugins this mode loads.
// No ZoneMod / competitive gameplay plugins. Just: base admin, ReadyUp and the
// requested feature plugins.
// =======================================================================================

//------------------------
// Sourcemod Basic Plugins (admin / base commands)
//------------------------
sm plugins load basebans.smx
sm plugins load basecommands.smx
sm plugins load basecomm.smx
sm plugins load admin-flatfile.smx
sm plugins load adminhelp.smx
sm plugins load adminmenu.smx
sm plugins load funcommands.smx
sm plugins load playercommands.smx

//----------------------------------
// Match flow
//----------------------------------
sm plugins load optional/readyup.smx

//----------------------------------
// Requested features (Pure only)
//----------------------------------
sm plugins load optional/l4d_tank_damage_announce.smx   // 伤害显示: chat damage dealt to Tank
sm plugins load optional/l4d_witch_damage_announce.smx  // 伤害显示: chat damage dealt to Witch
sm plugins load optional/l4d2_skill_detect.smx          // 连跳速度显示 (bunnyhop streak + top speed)
sm plugins load optional/witch_and_tankifier.smx        // Tank & Witch guaranteed every round
