// [注] 原文注释（原文保留不动）：分节标题——下面一条属于 ReadyUp（准备阶段）插件。
// ReadyUp Cvars
// [注] 直接设置（非 confogl_addcvar）：ReadyUp 面板上显示的配置名。由 ReadyUp 插件（`optional/readyup.sp`）提供，定义位于 `optional/readyup/setup.inc:51`：`CreateConVar("l4d_ready_cfg_name", "", "Configname to display on the ready-up panel")`；该定义在 `.inc` 中，故清单未收录。此处值 = `ZoneMod v2.9.1b`（面板上显示的版本标识）。
l4d_ready_cfg_name "ZoneMod v2.9.1b"
// [注] 空行：分隔 ReadyUp 与 Confogl 分节。

// [注] 原文注释（原文保留不动）：分节标题——下面三条是 Confogl 级强制项。
// Confogl Cvars
// [注] 强制 mp_gamemode = "versus"：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：引擎的游戏模式 ConVar；设为 versus = 强制对抗模式（其它取值如 campaign / survival / scavenge）。`mp_gamemode` 是引擎 ConVar；清单中它只作为其它插件的引用出现（如 `l4d2_anne_thirdperson_fix.sp`），无自建注册记录。行内注释原文：为配置强制 Versus。
confogl_addcvar mp_gamemode "versus"  // Force Versus for the config.
// [注] 强制 z_difficulty = "normal"：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：引擎难度设定；设为 normal = 普通（另有 easy / hard / impossible）。
confogl_addcvar z_difficulty "normal" // Force normal Difficulty to prevent co-op difficulty impacting the config.
// [注] 强制 confogl_pills_limit = 2：限制每张图安全屋外止痛药（pain pills）的数量；-1 = 不限制，>=0 = 限制为该值，此处 = 2（每张图安全屋外最多 2 个）。来源：Confogl（confoglcompmod）的 ItemTracking 模块在 confoglcompmod/ItemTracking.sp:188 用 FormatEx("%s_limit", …) 动态拼接名称后经 CreateConVarEx 注册（前缀 confogl_），故静态清单未收录。
confogl_addcvar confogl_pills_limit 2 // Limits the number of pain pills on each map outside of saferooms. -1: no limit; >=0: limit to cvar value
// [注] 空行：分隔 Confogl Cvars 与 ZoneMod 4v4 Cvars。

// [注] 原文注释（原文保留不动）：分节标题——下面十二条是 ZoneMod 4v4 对抗的关键参数。
// ZoneMod 4v4 Cvars
// [注] 强制 z_common_limit = 30：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：场上普通感染者（common）的数量上限；设为 30。引擎 ConVar；插件 `optional/l4d2_director_commonlimit_block.sp`（Director-scripted common limit blocker）会 `HookConVarChange` 监视它，用途（清单 myinfo 原文）：阻止导演脚本覆盖 `z_common_limit`，只影响脚本化的、高于该 cvar 的普感上限。
confogl_addcvar z_common_limit 30
// [注] 强制 z_ghost_delay_min = 16：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：Ghost（未附身感染者视角）允许的最小等待/延迟时间（秒）；设为 16，与 max 相同使该行为固定。
confogl_addcvar z_ghost_delay_min 16
// [注] 强制 z_ghost_delay_max = 16：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：Ghost（未附身感染者视角）允许的最大等待/延迟时间（秒）；设为 16。
confogl_addcvar z_ghost_delay_max 16
// [注] 强制 z_mega_mob_size = 50：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：大型尸潮（mega mob）的规模；设为 50。
confogl_addcvar z_mega_mob_size 50
// [注] 强制 z_mob_spawn_min_size = 15：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：尸潮规模下限；设为 15，与上限相同即固定 15 只。
confogl_addcvar z_mob_spawn_min_size 15
// [注] 强制 z_mob_spawn_max_size = 15：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：尸潮规模上限；设为 15。
confogl_addcvar z_mob_spawn_max_size 15
// [注] 强制 z_mob_spawn_min_interval_normal = 3600：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：普通难度下自然尸潮的最小间隔（秒）；设为 3600 = 1 小时（与 max 相同，实际等于关闭自然尸潮）。
confogl_addcvar z_mob_spawn_min_interval_normal 3600
// [注] 强制 z_mob_spawn_max_interval_normal = 3600：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：普通难度下自然尸潮的最大间隔（秒）；设为 3600 = 1 小时。
confogl_addcvar z_mob_spawn_max_interval_normal 3600
// [注] 强制 z_pounce_damage = 2：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：Hunter 扑击造成的伤害；设为 2。
confogl_addcvar z_pounce_damage 2
// [注] 强制 z_pounce_damage_interval = 0.2：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：Hunter 扑击伤害的结算间隔（秒）；设为 0.2。
confogl_addcvar z_pounce_damage_interval 0.2
// [注] 强制 hunter_pz_claw_dmg = 6：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：Hunter 近身爪击造成的伤害；设为 6。
confogl_addcvar hunter_pz_claw_dmg 6
// [注] 强制 tongue_drag_damage_amount = 5：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：Smoker 舌头拖拽每次结算的伤害；设为 5。
confogl_addcvar tongue_drag_damage_amount 5
// [注] 空行：分隔 ZoneMod 4v4 Cvars 与共享 cvar 引入。

// [注] 原文注释（原文保留不动）：分节标题——下面 exec 共享 cvar 文件。
// ZoneMod Shared Cvars
// [注] 执行 `shared_cvars.cfg`（141 行，见本文档 3.4 节）：引入服务器 / 带宽 / ReadyUp / 竞技 / 平衡等全部共享 ConVar。
exec cfgogl/zonemod/shared_cvars.cfg
// [注] 空行：分隔共享 cvar 与 zonemod 配置引入。

// [注] 原文注释（原文保留不动）：分节标题——下面 exec zonemod 专用配置。
// Config Cvars
// [注] 执行 `zonemod.cfg`（68 行，见本文档 3.7 节）：引入 ZoneMod 4v4 的插件级 ConVar、武器限制与共享设置。本行是文件最后一行，且没有结尾换行符（故 `wc -l` 只统计到 35）。
exec cfgogl/zonemod/zonemod.cfg