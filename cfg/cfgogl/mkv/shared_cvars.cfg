// 本文件：ZoneMod 公共服务器 cvar（各模式共用）

// Server Cvars —— 服务器基础设置
sv_pure 2                                  // 纯净服务器模式 2（仅检查非法文件，不强制纯净材质）
sv_alltalk 0                               // 关闭全队语音（特感/生还者不能互相听到）
confogl_addcvar sv_cheats 0                // 强制作弊开关关闭
confogl_addcvar sv_consistency 1           // 强制客户端文件一致性检查
confogl_addcvar sv_pure_kick_clients 1     // 纯净检查不通过的客户端踢出
confogl_addcvar sv_voiceenable 1           // 启用语音
confogl_addcvar sv_log_onefile 0           // 日志不合并为单文件
confogl_addcvar sv_logbans 1               // 记录封禁日志
// confogl_addcvar sv_allow_lobby_connect_only 0 // （已注释）允许不走大厅直接连接
confogl_addcvar vs_max_team_switches 9999  // 队伍切换次数上限 9999（不限制）
confogl_addcvar versus_marker_num 0        // 关闭安全室通关标记（红圈标记）

// Bandwidth Cvars —— 网络带宽/rate 设置
exec confogl_rates.cfg // 加载服务器网络速率配置（tickrate/最大带宽等）

// ReadyUp Cvars —— 准备阶段设置
l4d_ready_enabled 1 // 启用准备阶段系统（!ready/!live）

confogl_addcvar l4d_ready_survivor_freeze 0  // 准备阶段幸存者不冻结（可自由移动）
confogl_addcvar l4d_ready_delay 3            // 准备阶段进度条延迟 3 秒
confogl_addcvar l4d_ready_enable_sound 1     // 启用准备阶段提示音
confogl_addcvar l4d_ready_chuckle 0          // 关闭准备阶段随机笑声
confogl_addcvar l4d_ready_live_sound "ui/survival_medal.wav" // 开始比赛（!live）时播放的音效
confogl_addcvar coinflip_delay -1            // 掷硬币命令无延迟（-1 = 禁用延迟）
confogl_addcvar teamflip_delay -1            // 换边命令无延迟

// Config Cvars —— 配置文件切换设置
confogl_match_execcfg_off           "confogl_off.cfg"               // Execute this config file upon match mode ends. 比赛模式结束时执行 confogl_off.cfg
confogl_match_execcfg_on            "confogl.cfg"                   // Execute this config file upon match mode starts. 比赛模式开始时执行 confogl.cfg
confogl_match_killlobbyres          "0"                             // Sets whether the plugin will clear lobby reservation once a match have begun 比赛开始后不清除大厅预约
confogl_addcvar l4d2_lmm_unreserve_type 0                           // Keep lobby reservation; players can vote to remove it. 保留大厅预约，玩家可投票解除
confogl_match_restart               "1"                             // Sets whether the plugin will restart the map upon match mode being forced or requested 比赛模式加载时重启地图

// Confogl Cvars —— Confogl 核心比赛规则
confogl_addcvar confogl_boss_tank                   "1"             // Tank can't be prelit, frozen and ghost until player takes over, punch fix, and no rock throw for AI tank while waiting for player 玩家接管前 Tank 不可被打点/冻结/预览，AI Tank 等待期间不扔石头
confogl_addcvar confogl_boss_unprohibit             "1"             // Enable bosses spawning on all maps, even through they normally aren't allowed 允许 Boss 在所有地图刷新（无视地图原生限制）
confogl_addcvar confogl_lock_boss_spawns            "1"             // Enables forcing same coordinates for tank and witch spawns (excluding tanks during finales) 强制 Tank/Witch 刷新坐标一致（终局 Tank 除外）
confogl_addcvar confogl_remove_escape_tank          "0"             // Removes tanks which spawn as the rescue vehicle arrives on finales 不移除救援载具到达时刷新的 Tank
confogl_addcvar confogl_disable_tank_hordes         "1"             // Disables natural hordes while tanks are in play Tank 存活期间禁用自然尸潮
confogl_addcvar confogl_block_punch_rock            "0"             // Block tanks from punching and throwing a rock at the same time 不禁止 Tank 拳头与扔石头同时进行（由插件接管）
confogl_addcvar confogl_blockinfectedbots           "0"             // Blocks infected bots from joining the game, minus when a tank spawns (allows players to spawn a AI infected first before taking control of the tank) 不禁止特感 BOT（仅 Tank 刷新时允许先出 AI 特感）
confogl_addcvar director_allow_infected_bots        "1"
confogl_addcvar confogl_reduce_finalespawnrange     "1"             // Adjust the spawn range on finales for infected, to normal spawning range 终局特感刷新范围调整为普通范围
confogl_addcvar confogl_remove_chainsaw             "0"             // Remove all chainsaws 不移除电锯
confogl_addcvar confogl_remove_defib                "0"             // Remove all defibrillators 不移除电击器
confogl_addcvar confogl_remove_grenade              "0"             // Remove all grenade launchers 不移除榴弹发射器
confogl_addcvar confogl_remove_m60                  "0"             // Remove all M60 rifles 不移除 M60
confogl_addcvar confogl_remove_lasersight           "0"             // Remove all laser sight upgrades 不移除激光瞄准器
confogl_addcvar confogl_remove_saferoomitems        "1"             // Remove all extra items inside saferooms (items for slot 3, 4 and 5, minus medkits) 移除安全室多余物品（3/4/5 号位物品，医疗包除外）
confogl_addcvar confogl_remove_upg_explosive        "0"             // Remove all explosive upgrade packs 不移除爆炸弹药包
confogl_addcvar confogl_remove_upg_incendiary       "0"             // Remove all incendiary upgrade packs 不移除燃烧弹药包
confogl_addcvar confogl_replace_cssweapons          "0"             // Replace CSS weapons with normal L4D2 weapons 不替换 CSS 武器（由 weaponrules 插件处理）
confogl_addcvar confogl_replace_startkits           "0"             // Replace medkits at mission start with pain pills 开局医疗包不替换为止痛药
confogl_addcvar confogl_replace_finalekits          "0"             // Replace medkits during finale with pain pills 终局医疗包不替换为止痛药
confogl_addcvar confogl_waterslowdown               "0"             // Sets whether water will slowdown the survivors by another 10% 水中不再额外减速 10%
confogl_addcvar confogl_enable_itemtracking         "1"             // Enable the itemtracking module, which controls and limits item spawns. Item Limits will be read from Cvars and mapinfo.txt, with preferences to mapinfo settings 启用物资追踪，按 cvar 和 mapinfo.txt 限制刷新
confogl_addcvar confogl_itemtracking_savespawns     "1"             // Keep item spawns the same on both rounds. Item spawns will be remembered from round1 and reproduced on round2. 两回合物资刷新位置一致（第 1 回合记录，第 2 回合复现）
confogl_addcvar confogl_itemtracking_mapspecific    "3"             // Allow ConVar limits to be overridden by mapinfo.txt limits 允许 mapinfo.txt 覆盖 cvar 物资限制（模式 3）
confogl_addcvar confogl_adrenaline_limit            "-1"            // Limits the number of adrenaline shots on each map outside of saferooms. -1: no limit; >=0: limit to cvar value 肾上腺素不限量
confogl_addcvar confogl_pipebomb_limit              "-1"            // Limits the number of pipe bombs on each map outside of saferooms. -1: no limit; >=0: limit to cvar value 管制炸弹不限量
confogl_addcvar confogl_molotov_limit               "-1"            // Limits the number of molotovs on each map outside of saferooms. -1: no limit; >=0: limit to cvar value 燃烧瓶不限量
confogl_addcvar confogl_vomitjar_limit              "-1"            // Limits the number of bile bombs on each map outside of saferooms. -1: no limit; >=0: limit to cvar value 胆汁罐不限量
confogl_addcvar confogl_SM_enable                   "0"             // Enable the health bonus style scoring 关闭血量加成计分（使用 hybrid_scoremod）
confogl_addcvar confogl_replace_tier2 0             // 不替换 T2 武器刷新
confogl_addcvar confogl_replace_tier2_finale 0      // 终局不替换 T2 武器
confogl_addcvar confogl_replace_tier2_all 0         // 不全图替换 T2 武器
confogl_addcvar confogl_limit_tier2 0               // 不限制 T2 武器数量
confogl_addcvar confogl_limit_tier2_saferoom 0      // 不限制安全室 T2 武器

// Balancing Cvars —— 平衡性设置
confogl_addcvar director_vs_convert_pills 0                 // 对抗模式不给幸存者自动转换药丸
confogl_addcvar z_finale_spawn_safety_range 600             // Tank finale bugfix 终局 Tank 刷新安全距离修复
confogl_addcvar z_fallen_max_count 0                        // 不刷新坠落特感（fallen survivor）
confogl_addcvar sv_infected_ceda_vomitjar_probability 0.2     // CEDA 防护服普感不掉胆汁罐
confogl_addcvar sv_force_time_of_day 0                      // 不强制地图时间（使用地图默认）
confogl_addcvar z_brawl_chance 0                            // 普感内斗（brawl）概率 0
confogl_addcvar z_female_boomer_spawn_chance 50             // 女 Boomer 刷新概率 50%
confogl_addcvar nav_lying_down_percent 0                    // 普感躺地（lying down）概率 0
confogl_addcvar z_must_wander 1                             // 普感必须游荡（符合原版行为）

// Competitive Cvars —— 对抗性设置
confogl_addcvar z_pushaway_force 0                        // 推击推动力 0（禁推队友位移）
confogl_addcvar z_gun_swing_vs_min_penalty 1              // 开枪挥拳最小惩罚 1
confogl_addcvar z_gun_swing_vs_max_penalty 4              // 开枪挥拳最大惩罚 4
confogl_addcvar z_leap_interval_post_incap 18             // Jockey 骑倒人后跳跃冷却 18 秒
confogl_addcvar z_jockey_control_variance 0.0             // Jockey 骑乘方向控制无随机偏差
confogl_addcvar z_exploding_shove_min 4                   // Boomer 爆炸推开特感最小 4
confogl_addcvar z_exploding_shove_max 4                   // Boomer 爆炸推开特感最大 4
confogl_addcvar gascan_spit_time 2                        // 酸液烧油桶时间 2 秒
confogl_addcvar z_vomit_interval 20                       // Boomer 呕吐冷却 20 秒
confogl_addcvar sv_gameinstructor_disable 1               // 关闭游戏指导提示（图标）
confogl_addcvar z_cough_cloud_radius 0                    // Boomer 咳嗽云半径 0（不影响听觉）
confogl_addcvar z_spit_interval 16                        // Spitter 酸液冷却 16 秒
confogl_addcvar tongue_hit_delay 13                       // Smoker 舌头命中后再吐冷却 13 秒
confogl_addcvar z_pounce_silence_range 999999             // Hunter 无声扑击距离 999999（全图无声扑）
confogl_addcvar versus_shove_jockey_fov_leaping 30        // Jockey 飞跃时推击视野角度 30
confogl_addcvar z_holiday_gift_drop_chance 0              // 节日礼物掉落概率 0
confogl_addcvar z_door_pound_damage 160                   // 特感拍门伤害 160
confogl_addcvar z_pounce_door_damage 500                  // Hunter 拍门伤害 500
confogl_addcvar tongue_release_fatigue_penalty 0          // 舌头解控后无疲劳惩罚
confogl_addcvar z_gun_survivor_friend_push 0              // 禁止开枪推挤队友
confogl_addcvar z_respawn_interval 20                     // 特感复活间隔 20 秒
confogl_addcvar sb_max_team_melee_weapons 4               // BOT 队伍近战武器上限 4
confogl_addcvar z_charge_warmup 0                         // Charger 冲锋无前摇
confogl_addcvar charger_pz_claw_dmg 7                     // Charger 爪击伤害 10
confogl_addcvar tongue_vertical_choke_height 99999.9      // 舌头竖直勒吊高度 99999.9（禁高吊）
confogl_addcvar survivor_ledge_grab_ground_check_time 1   // 幸存者挂边落地检查时间 1 秒
confogl_addcvar z_tank_throw_health 100                   // Tank 石头血量条件 100（不受血量限制）

// AI Improvement Cvars —— AI 特感增强
confogl_addcvar boomer_exposed_time_tolerance 0.2 // Boomer 暴露容忍时间 0.2 秒（更快反应）
confogl_addcvar boomer_vomit_delay 0.1            // AI Boomer 呕吐延迟 0.1 秒
confogl_addcvar hunter_pounce_ready_range 1000    // AI Hunter 扑击准备距离 1000
confogl_addcvar hunter_committed_attack_range 600 // AI Hunter 锁定攻击距离 600

// Tank/Witch Cvars —— Tank/Witch 刷新设置
confogl_addcvar versus_tank_flow_team_variation 0          // 两队 Tank 刷新进度无随机偏差（完全一致）
confogl_addcvar versus_boss_flow_max 0.85                  // Boss 最远刷新进度 85%
confogl_addcvar versus_boss_flow_min 0.20                  // Boss 最近刷新进度 20%
confogl_addcvar tank_stuck_time_suicide 999999999          // Tank 卡住自尽时间 999999999（禁用自尽）
confogl_addcvar tank_stuck_visibility_tolerance_suicide 999999999 // Tank 不可见判定自尽时间 999999999（禁用）
confogl_addcvar tank_visibility_tolerance_suicide 999999999 // Tank 可见性自尽容差 999999999（禁用）
confogl_addcvar director_tank_lottery_selection_time 3     // Tank 抽签分配时间 3 秒
confogl_addcvar z_frustration_spawn_delay 20               // Tank 沮丧（换人）刷新延迟 20 秒
confogl_addcvar z_frustration_los_delay 1.2                // Tank 失去视线沮丧延迟 1.2 秒
confogl_addcvar tankcontrol_print_all 1                    // Tank 控制权分配结果向全体播报
confogl_addcvar tank_ground_pound_duration 0.1             // Tank 地面捶击（pound）时长 0.1 秒
confogl_addcvar z_witch_damage_per_kill_hit 15             // Witch 秒杀击中伤害 15

// Stripper Path —— Stripper 配置路径
confogl_addcvar stripper_cfg_path cfg/stripper/zonemod // 指定 Stripper:Source 使用 zonemod 配置目录
