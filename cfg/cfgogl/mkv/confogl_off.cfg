// 本文件：比赛模式结束（关闭）时执行的清理配置，由 confogl_match_execcfg_off 指定

// Disable ReadyUp
l4d_ready_enabled 0 // 关闭准备阶段插件（退回普通服务器状态）

// Reset Default Common Limit, Static Spawns, and String Count
reset_static_maps   // 重置所有静态刷怪地图记录（清除 static_tank_map 等地图规则）
sm_resetstringcount // 重置 ReadyUp 字符串计数（清除 sm_addreadystring 添加的文本）

// Unlock Plugins and reload defaults
confogl_resetclientcvars // 恢复所有被 confogl 记录的客户端 cvar（如玩家 lerps 等）
confogl_resetcvars       // 恢复所有被 confogl_addcvar 记录的服务器 cvar 到比赛前原值
pred_unload_plugins      // 卸载预测相关插件（pred 插件集），避免留在普通模式运行
