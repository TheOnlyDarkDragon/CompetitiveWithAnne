// 本文件：mkv 模式启动时加载的插件清单（配合 confogl 的 load_lock 使用）

//-------------------------------------------
// ZoneMod Shared Plugins
//-------------------------------------------
exec cfgogl/mkv/shared_plugins.cfg // 加载 ZoneMod 公共插件列表

//-------------------------------------------
// ZoneMod 4v4
//-------------------------------------------
sm plugins load optional/survivor_mvp.smx        // 幸存者 MVP 统计面板
sm plugins load optional/l4d2_antibaiter.smx     // 反钓鱼（防拖延）插件
sm plugins load optional/l4d2_playstats.smx      // 回合数据统计
sm plugins load optional/l4d2_skill_detect.smx   // 高操作检测播报
sm plugins load optional/autopause.smx           // 自动暂停（掉线/断线时暂停比赛）
sm plugins load optional/l4d2_tongue_timer.smx   // Smoker 舌头快速解控冷却
