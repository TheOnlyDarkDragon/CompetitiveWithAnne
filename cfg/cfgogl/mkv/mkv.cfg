// 说明：confogl_addcvar 表示该 cvar 由 confogl 记录原值，比赛模式结束后自动恢复；
//       无此前缀的命令为插件命令或直接写入的 cvar。

// [witch_and_tankifier.smx] —— Tank/Witch 刷新控制插件
confogl_addcvar sm_tank_can_spawn 1       // 允许本配置刷新 Tank（0 = 本配置不出 Tank）
confogl_addcvar sm_witch_can_spawn 0      // 禁止本配置刷新 Witch

// [l4d2_antibaiter.smx] —— 反钓鱼（防拖延）插件：幸存者停滞不前则倒计时并触发尸潮
confogl_addcvar l4d2_antibaiter_delay 15          // 幸存者离开安全室 15 秒后反钓鱼算法才开始计时
confogl_addcvar l4d2_antibaiter_horde_timer 30    // 停滞判定成立后 30 秒倒计时，期间不推进则触发惩罚尸潮
confogl_addcvar l4d2_antibaiter_progress 0.03     // 幸存者推进超过 3% 流程即重置反钓鱼计时器
confogl_addcvar l4d2_antibaiter_bile_stop 1       // 有玩家被胆汁命中时暂停惩罚计时（1 = 暂停）

// [l4d_boss_percent.smx] —— Boss 进度百分比显示插件
confogl_addcvar l4d_global_percent 0     // 0 = !boss/!tank/!witch 查询只显示给本人，不广播全队
confogl_addcvar l4d_tank_percent 1       // 准备阶段及查询命令中显示 Tank 刷新进度百分比
confogl_addcvar l4d_witch_percent 0      // 不显示 Witch 进度（本包已禁 Witch）
confogl_addcvar l4d_boss_vote 1          // [l4d_boss_vote.sp] 允许玩家投票修改 Tank/Witch 进度

// [l4d2_tongue_timer.smx] —— Smoker 舌头快速解控冷却插件
confogl_addcvar l4d2_tongue_delay_tank 8.0      // 被 Tank 拳头/石头快速救下时，Smoker 舌头冷却 8 秒（原版约 0.5 秒）
confogl_addcvar l4d2_tongue_delay_survivor 4.0  // 被幸存者队友快速射下车时，Smoker 舌头冷却 4 秒

// [l4d2_nobhaps.smx] —— 禁连跳（bhop）插件
confogl_addcvar simple_antibhop_enable 1  // 启用禁连跳检测
confogl_addcvar bhop_allow_survivor 0     // 幸存者同样禁止连跳（0 = 禁止）
confogl_addcvar bhop_except_si_flags 16	// only jockey —— 特感连跳豁免位掩码：16 = 仅 Jockey 可连跳（1 Smoker/2 Boomer/4 Hunter/8 Spitter/16 Jockey/32 Charger/64 Tank）

// [boomer_horde_equalizer_refactored.smx] —— Boomer 尸潮平衡插件
confogl_addcvar boomer_horde_equalizer                1  // 启用尸潮平衡
confogl_addcvar boomer_horde_equalizer_events_default 1  // 事件（机关/终局）期间也使用平衡后的尸潮设置
confogl_addcvar z_notice_it_range                     950 // 被胆汁命中的游荡普感感知范围 950 单位
boomer_horde_amount 1 12  // 12 Common spawned for the 1st Survivor boomed + Wandering common in z_notice_it_range
                          // 第 1 名被胆汁命中的幸存者生成 12 只尸潮（另加感知范围内的游荡普感）
boomer_horde_amount 2 13  // 13 Common spawned for the 2nd Survivor boomed + Wandering common in z_notice_it_range
                          // 第 2 名被命中的幸存者生成 13 只
boomer_horde_amount 3 10  // 10 Common spawned for the 3rd Survivor boomed + Wandering common in z_notice_it_range
                          // 第 3 名被命中的幸存者生成 10 只
boomer_horde_amount 4 10  // 10 Common spawned for the 4th Survivor boomed + Wandering common in z_notice_it_range
                          // 第 4 名被命中的幸存者生成 10 只

// [autopause.smx] —— 自动暂停插件
confogl_addcvar autopause_enable 1   // 启用自动暂停（如玩家掉线时自动暂停比赛）
confogl_addcvar autopause_force 1    // 允许强制暂停
confogl_addcvar autopause_apdebug 0  // 关闭调试输出

// [l4d_weapon_limits.smx] —— 武器数量限制插件，格式：l4d_wlimits_add <每图上限> <给弹(0=不给 -1=仅主武器给)> <武器...>
l4d_wlimits_add 3 1 weapon_smg_silenced weapon_smg                      // Uzi/消音 Uzi 每图合计限 3 把，给弹
l4d_wlimits_add 3 1 weapon_pumpshotgun weapon_shotgun_chrome            // 木喷/铁喷每图合计限 3 把，给弹
l4d_wlimits_add 1 0 weapon_pistol_magnum                               // 马格南每图限 1 把，不给备用弹药
l4d_wlimits_add 0 1 weapon_hunting_rifle weapon_sniper_scout weapon_sniper_awp // 狙击枪（猎枪/Scout/AWP）每图限 0 把（完全移除）
l4d_wlimits_lock                                                        // 锁定以上规则并开始执行（锁定后不可再添加）

// [l4d2_melee_shenanigans.smx] —— 近战武器规则插件
confogl_addcvar l4d2_melee_drop_method 2  // 近战武器掉落/替换方式 = 2

// [l4d2_playstats.smx + survivor_mvp] —— 数据统计与 MVP 面板插件
confogl_addcvar sm_survivor_mvp_brevity 0        // 0 = MVP 面板使用完整详细模式
confogl_addcvar sm_survivor_mvp_brevity_latest 111 // 面板各信息列显示开关位掩码（111 = 全部显示）
confogl_addcvar sm_stats_autoprint_vs_round 8372  // 对抗每回合结束自动打印统计的内容位掩码

// [l4d2_skill_detect.smx] —— 高操作检测播报插件（高扑、远牛撞、秒杀等）
confogl_addcvar sm_skill_report_enable 1 // 启用技能操作聊天播报

// Shared Settings —— 公共详细设置（掉落物控制、Tank 属性、武器数值、静态 Tank/Witch 地图等）
exec cfgogl/mkv/shared_settings.cfg
