// 本文件：mkv 模式入口配置（比赛模式开启时执行）

// ReadyUp Cvars —— 准备阶段插件设置
l4d_ready_cfg_name "进阶包抗" // 准备阶段顶部显示的配置名称

// Confogl Cvars —— 基础模式设置
confogl_addcvar mp_gamemode "versus"  // Force Versus for the config. 强制对抗模式
confogl_addcvar z_difficulty "normal" // Force normal Difficulty to prevent co-op difficulty impacting the config. 强制普通难度，防止战役难度影响配置
confogl_addcvar confogl_pills_limit -1 // Limits the number of pain pills on each map outside of saferooms. -1: no limit; >=0: limit to cvar value 每图安全室外止痛药限 2 瓶

// ZoneMod 4v4 Cvars —— 4v4 对抗核心数值
confogl_addcvar z_common_limit 50           // 场上同时存在的普通感染者上限 50
confogl_addcvar z_ghost_delay_min 16        // 特感死后复活（出鬼魂）最短等待 16 秒
confogl_addcvar z_ghost_delay_max 20        // 特感死后复活最长等待 20 秒
confogl_addcvar z_mega_mob_size 60          // 终局/事件大尸潮规模 50
confogl_addcvar z_mob_spawn_min_size 20     // 自然尸潮最小规模 15
confogl_addcvar z_mob_spawn_max_size 30     // 自然尸潮最大规模 15（固定 15）
confogl_addcvar z_mob_spawn_min_interval_normal 3600 // 自然尸潮最小间隔 3600 秒（实际禁用自然尸潮）
confogl_addcvar z_mob_spawn_max_interval_normal 3600 // 自然尸潮最大间隔 3600 秒
confogl_addcvar z_pounce_damage 1           // Hunter 高扑基础伤害 2（实际伤害按高度加成计算）
confogl_addcvar z_pounce_damage_interval 0.1 // Hunter 扑击伤害结算间隔 0.2 秒
confogl_addcvar hunter_pz_claw_dmg 6        // Hunter 爪击伤害 6
confogl_addcvar tongue_drag_damage_amount 4 // Smoker 拖拽每跳伤害 5

// ZoneMod Shared Cvars —— 公共服务器/比赛规则 cvar
exec cfgogl/mkv/shared_cvars.cfg

// Config Cvars —— 本模式专属设置
exec cfgogl/mkv/mkv.cfg
