// [l4d_prop_touching_rules.smx] —— 可击飞物体接触规则
confogl_addcvar prop_moveaway_mass_thres 150.0			// Should cover most non-lethal hittables (i.e. cs_assault/HandTruck.mdl) 质量阈值 150：低于此质量的物体接触不移除（如手推车）
confogl_addcvar prop_touching_moveaway 1				// Still allow moving away small props 仍允许移开小型物体
confogl_addcvar prop_heavy_touching_move_above 0        // 重型物体接触时不移开

// [l4d2_uncommon_blocker.smx] —— 特殊感染者屏蔽
confogl_addcvar sm_uncinfblock_enabled 1  // 启用特殊感染者屏蔽
confogl_addcvar sm_uncinfblock_flags 127  // 屏蔽全部 7 种特殊感染者（位掩码 127 = 全部）

// [l4d2_ghost_warp.smx] —— 幽灵传送
confogl_addcvar l4d2_ghost_warp_flag 1 // Enable ghost warp with command only 'sm_warp' 幽灵可通过 !warp 命令传送
confogl_addcvar l4d2_ghost_warp_delay 0.45 // 幽灵传送冷却 0.45 秒

// [l4d_static_punch_getup.smx] —— Tank 拳击爬起时间固定
confogl_addcvar tank_punch_getup_scale 0.5  // 54 frames / 30 fps * 0.5 = 0.9s 被拳击后爬起时间缩放 0.5（固定 0.9 秒）

// [l4d2_rock_trace_unblock.smx] —— Tank 石头弹道解锁
confogl_addcvar l4d2_rock_trace_unblock_flag 1 // 启用石头弹道解锁修复
confogl_addcvar l4d2_rock_jockey_dismount 0    // 石头不会打落骑乘中的 Jockey

// [charger_incap_damage] —— Charger 对倒地者伤害
confogl_addcvar charger_dmg_incapped "20.0" // Default 15 Charger 撞击已倒地者伤害 20（默认 15）

// [l4d2_spit_spread_patch.smx] —— 酸液散布修正
confogl_addcvar l4d2_spit_spread_saferoom 1      // 安全室内酸液散布修正启用
confogl_addcvar l4d2_deathspit_trace_height 9999.9 // 死亡酸液弹道高度 9999.9（不受限）
confogl_addcvar l4d2_spit_max_flames 10          // 酸液最大伤害计算次数 10
confogl_addcvar l4d2_spit_water_collision 1      // 酸液在水面正确碰撞（浅水仍有效）

// [l4d2_ladder_rambos.smx] —— 爬梯动作控制
confogl_addcvar cssladders_enabled 1         // 启用爬梯增强
confogl_addcvar cssladders_allow_m2 0			//爬梯子时禁推 爬梯时禁止推击（M2）
confogl_addcvar cssladders_allow_reload 1    // 爬梯时允许换弹
confogl_addcvar cssladders_allow_shotgun_reload 0 // 爬梯时禁止霰弹枪换弹
confogl_addcvar cssladders_allow_switch 0    // 爬梯时禁止切换武器

// [l4d2_tank_props_glow.smx] —— Tank 可击飞物体高亮
confogl_addcvar l4d_tank_props_glow            1           // 启用 Tank 阶段可击飞物体发光轮廓
confogl_addcvar l4d2_tank_prop_glow_color      "255 255 255" // 高亮颜色：白色
confogl_addcvar l4d2_tank_prop_glow_range      4500        // 最大高亮距离 4500
confogl_addcvar l4d2_tank_prop_glow_range_min  256         // 最小高亮距离 256
confogl_addcvar l4d2_tank_prop_glow_only       0           // 非仅高亮模式（普通玩家也能看到）
confogl_addcvar l4d2_tank_prop_glow_spectators 1           // 观战者也可见
confogl_addcvar l4d2_tank_prop_dissapear_time  999.0        // 高亮消失时间 10 秒

// [l4d2_tankrage] —— Tank 怒气控制
confogl_addcvar l4d2_tankrage_flowpercent 7   // 幸存者推进超过 7% 流程后 Tank 解除怒气冻结
confogl_addcvar l4d2_tankrage_freezetime 4.0  // Tank 出生后 4 秒怒气冻结（不立即狂暴）

// [l4d2_sound_manipulation.smx] —— 声音操纵限制
confogl_addcvar sound_flags 7 // 声音修复位掩码 7（含摔落/Tank 火焰等声音修复）

// [fix_engine.smx] —— 引擎修复
confogl_addcvar engine_fix_flags 28 // 引擎修复位掩码 28（攻击方向/视角修复等）

// [l4d_tank_rush] —— Tank 锁定路程分
confogl_addcvar l4d_no_tank_rush 1                   // 启用 Tank 锁定路程分机制
confogl_addcvar l4d_no_tank_rush_unfreeze_saferoom 1 // 终点安全室内解冻路程分计算
confogl_addcvar l4d_no_tank_rush_unfreeze_ai 0       // AI Tank 是否解冻路程分

// [panel_text.smx] —— 准备面板文本
sm_addreadystring " " // 添加一个空字符串到准备面板
sm_lockstrings        // 锁定字符串（防止后续修改）

// [checkpoint-rage-control.smx] —— 检查点怒气控制
confogl_addcvar crc_global 1 // 全局启用安全室附近 Tank 怒气控制

// [si_fire_immunity.smx] —— 特感火焰免疫
confogl_addcvar infected_fire_immunity 3 // 特感火焰免疫模式 3（仅 Tank 免疫燃烧瓶？按插件定义位掩码）

// [l4d2_nosecondchances.smx] —— 无第二次机会
confogl_addcvar bot_kick_delay 0 // 死亡 BOT 立即踢出（无延迟）

// [l4d2_magnum_incap.smx] —— 马格南倒地
confogl_addcvar l4d2_replace_magnum_incap 2 // 倒地马格南处理模式 2

// [l4d2_saferoom_item_remove.smx] —— 安全室物品移除
confogl_addcvar sm_safeitemkill_saferooms 3 // 移除范围：安全室模式 3（含终点安全室）
confogl_addcvar sm_safeitemkill_items 13    // 移除物品位掩码 13（药包/ throwable 等）

// [bossspawningfix.smx] —— Boss 刷新修复
