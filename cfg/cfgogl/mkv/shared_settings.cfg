// [l4d_equalise_alarm_cars.smx] —— 警报车公平化
confogl_addcvar l4d_equalise_alarm_start_disabled 1 // 两回合警报车初始状态一致（禁用随机）

// [l4d_jockey_ledgehang.smx] —— Jockey 挂边
