// [注] 原文注释（原文保留不动）：分组标题——下面两条属于 Tank and Witch ifier!。
// [witch_and_tankifier.smx]
// [注] 强制 `sm_tank_can_spawn = 1`：是否允许坦克生成；`1` = 允许（插件默认 1）。
confogl_addcvar sm_tank_can_spawn 1
// [注] 强制 `sm_witch_can_spawn = 0`：是否允许 Witch 生成；此处 = 0（禁止女巫刷新，插件默认 1）。
confogl_addcvar sm_witch_can_spawn 0
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面四条属于 L4D2 Antibaiter（反挂机）。
// [l4d2_antibaiter.smx]
// [注] 强制 `l4d2_antibaiter_delay = 15`：反挂机算法启动前的延迟秒数（插件默认 20）；此处 = 15 秒。
confogl_addcvar l4d2_antibaiter_delay 15
// [注] 强制 `l4d2_antibaiter_horde_timer = 30`：到尸潮的倒计时秒数（插件默认 60）；此处 = 30 秒。
confogl_addcvar l4d2_antibaiter_horde_timer 30
// [注] 强制 `l4d2_antibaiter_progress = 0.03`：生还者必须取得的最小进度才重置反挂机计时器（插件默认 0.03）。
confogl_addcvar l4d2_antibaiter_progress 0.03
// [注] 强制 `l4d2_antibaiter_bile_stop = 1`：玩家被 Boomer 喷吐时是否停止计时器；`1` = 停止（插件默认 0）。
confogl_addcvar l4d2_antibaiter_bile_stop 1
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面四条属于 [L4D2] Boss Percents/Vote Boss Hybrid 与 [L4D2] Vote Boss。
// [l4d_boss_percent.smx]
// [注] 强制 `l4d_global_percent = 0`：使用命令时是否向全队显示 boss 百分比（插件默认 0）；此处 = 0（不向全队显示）。
confogl_addcvar l4d_global_percent 0
// [注] 强制 `l4d_tank_percent = 1`：是否在聊天中显示 Tank 流程百分比；`1` = 显示（插件默认 1）。
confogl_addcvar l4d_tank_percent 1
// [注] 强制 `l4d_witch_percent = 0`：是否在聊天中显示 Witch 流程百分比；此处 = 0（不显示，插件默认 1）。
confogl_addcvar l4d_witch_percent 0
// [注] 强制 `l4d_boss_vote = 1`：是否启用 boss 投票；`1` = 启用（插件 [L4D2] Vote Boss 默认 1；清单中 `optional/l4d_boss_vote.sp` 与 `optional/AnneHappy/l4d_boss_vote.sp` 各注册一份）。
confogl_addcvar l4d_boss_vote 1
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面两条属于 Tongue Timer。
// [l4d2_tongue_timer.smx]
// [注] 强制 `l4d2_tongue_delay_tank = 8.0`：Smoker 被坦克拳击或石头快速解救后的冷却秒数（原生约 0.5 秒，插件默认 8.0）；此处 = 8.0 秒。
confogl_addcvar l4d2_tongue_delay_tank 8.0
// [注] 强制 `l4d2_tongue_delay_survivor = 4.0`：Smoker 被生还者快速解救后的冷却秒数（原生约 0.5 秒，插件默认 4.0）；此处 = 4.0 秒。
confogl_addcvar l4d2_tongue_delay_survivor 4.0
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面三条属于 Simple Anti-Bunnyhop。
// [l4d2_nobhaps.smx]
// [注] 强制 `simple_antibhop_enable = 1`：总开关，`0` 关闭 Simple Anti-Bhop、`1` 启用（插件默认 1）；此处 = 1。
confogl_addcvar simple_antibhop_enable 1
// [注] 强制 `bhop_allow_survivor = 0`：是否允许生还者连跳，`1` 允许 / `0` 禁止（插件默认 0）；此处 = 0（禁止）。
confogl_addcvar bhop_allow_survivor 0
// [注] 强制 `bhop_except_si_flags = 16`：豁免禁跳的特感位掩码（范围 0~127，插件默认 0）：`1` smoker、`2` boomer、`4` hunter、`8` spitter、`16` jockey、`32` charger、`64` tank；`16` = 仅 Jockey（与行内注释一致）。
confogl_addcvar bhop_except_si_flags 16	// only jockey
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面七条属于 Boomer Horde Equalizer (Refactored)。
// [boomer_horde_equalizer_refactored.smx]
// [注] 强制 `boomer_horde_equalizer = 1`：是否修复 Boomer 尸潮规模因游荡普感而不同的问题（`1` 开 / `0` 关）。清单中该名字在非重构版（`optional/boomer_horde_equalizer.sp:31`，默认 1）与重构版（`optional/boomer_horde_equalizer_refactored.sp:87`）各注册一份，后者的清单描述为「同 1117，重构版插件中的同名 ConVar」；此处 = 1（开启）。
confogl_addcvar boomer_horde_equalizer                1
// [注] 强制 `boomer_horde_equalizer_events_default = 1`：活动尸潮期间是否使用默认 Boomer 行为，`1` 是 / `0` 覆盖（插件默认 1）；此处 = 1。
confogl_addcvar boomer_horde_equalizer_events_default 1
// [注] 强制 z_notice_it_range = 950：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：普感「注意到目标」并聚拢过来的范围（单位）；设为 950（插件作者注释称引擎默认 1500）。行内证据来自插件源码 `optional/boomer_horde_equalizer_refactored.sp` 头部注释原文：「With this plugin I highly recommend tweaking the "z_notice_it_range" it ConVar, as wandering common will still pile in on top of this within a certain range. (Default 1500)」——即该 ConVar 决定"一定范围内的游荡普感仍会聚拢过来"的距离，插件作者标注默认 1500；此处改为 950。
confogl_addcvar z_notice_it_range                     950
// [注] 服务器控制台指令（玩家无法使用）：`boomer_horde_amount <被喷人数> <尸潮数量>` = 设置 Boomer 尸潮数量。插件 = Boomer Horde Equalizer (Refactored)（`boomer_horde_equalizer_refactored.sp:92`）。本行：第 1 名生还者被喷时刷 12 只普感（行内注释：这 12 只 + `z_notice_it_range` 内的游荡普感）。
boomer_horde_amount 1 12  // 12 Common spawned for the 1st Survivor boomed + Wandering common in z_notice_it_range
// [注] 同上：第 2 名生还者被喷时刷 13 只普感。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「boomer_horde_equalizer_refactored.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
boomer_horde_amount 2 13  // 13 Common spawned for the 2nd Survivor boomed + Wandering common in z_notice_it_range
// [注] 同上：第 3 名生还者被喷时刷 10 只普感。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「boomer_horde_equalizer_refactored.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
boomer_horde_amount 3 10  // 10 Common spawned for the 3rd Survivor boomed + Wandering common in z_notice_it_range
// [注] 同上：第 4 名生还者被喷时刷 10 只普感。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「boomer_horde_equalizer_refactored.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
boomer_horde_amount 4 10  // 10 Common spawned for the 4th Survivor boomed + Wandering common in z_notice_it_range
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面三条属于 L4D2 Auto-pause。
// [autopause.smx]
// [注] 强制 `autopause_enable = 1`：玩家崩溃掉线时是否自动暂停；`1` = 启用（插件默认 1）。
confogl_addcvar autopause_enable 1
// [注] 强制 `autopause_force = 1`：玩家崩溃掉线时是否强制暂停（插件默认 0）；此处 = 1（强制）。
confogl_addcvar autopause_force 1
// [注] 强制 `autopause_apdebug = 0`：调试等级（范围 0~3）：`0` 不调试、`1` 写 SourceMod 日志、`2` 聊天输出、`3` 两者；此处 = 0。
confogl_addcvar autopause_apdebug 0
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面五条属于 L4D Weapon Limits。
// [l4d_weapon_limits.smx]
// [注] 服务器控制台指令（玩家无法使用）。插件 = L4D Weapon Limits（`optional/l4d_weapon_limits.sp:81`）。源码原文用法：`l4d_wlimits_add <limit> <ammo> <weapon1> <weapon2> ... <weaponN>`，其中 `ammo` 的源码说明为「-1: Given for primary weapon spawns only, 0: no ammo given ever, else: ammo always given」。本行：上限 `3` 把、`ammo = 1`（总是给弹药）、作用武器 = `weapon_smg_silenced` 与 `weapon_smg`（两者共用同一条上限）。
l4d_wlimits_add 3 1 weapon_smg_silenced weapon_smg
// [注] 同上：上限 3、ammo = 1（总是给弹药），作用武器 = `weapon_pumpshotgun` 与 `weapon_shotgun_chrome`。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「l4d_weapon_limits.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
l4d_wlimits_add 3 1 weapon_pumpshotgun weapon_shotgun_chrome
// [注] 同上：上限 `1`、`ammo = 0`（永不给弹药），作用武器 = `weapon_pistol_magnum`（马格南）。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「l4d_weapon_limits.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
l4d_wlimits_add 1 0 weapon_pistol_magnum
// [注] 同上：上限 `0`（即不允许出现）、ammo = 1，作用武器 = `weapon_hunting_rifle`、`weapon_sniper_scout`、`weapon_sniper_awp`（三把狙）。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「l4d_weapon_limits.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
l4d_wlimits_add 0 1 weapon_hunting_rifle weapon_sniper_scout weapon_sniper_awp
// [注] 服务器控制台指令（玩家无法使用）：锁定武器限制，以加快查找速度（源码注册描述：「Locks the limits to improve search speeds」）。插件 = L4D Weapon Limits（`l4d_weapon_limits.sp:82`）。锁定后不可再 `l4d_wlimits_add`。
l4d_wlimits_lock
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面一条属于 Shove Shenanigans - REVAMPED。
// [l4d2_melee_shenanigans.smx]
// [注] 强制 `l4d2_melee_drop_method = 2`：坦克拳击手持近战武器的生还者时的处理。源码 `optional/l4d2_melee_shenanigans.sp:23` 的原文：「What to do when a Tank punches a Survivor that's holding out a melee weapon? 0: Nothing. 1: Drop Melee Weapon. 2: Force Switch to Primary Weapon.」→ `2` = 强制切换到主武器（插件默认 2）。
confogl_addcvar l4d2_melee_drop_method 2
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面三条与 Player Statistics（`l4d2_playstats.smx`）及 Survivor MVP notification（`survivor_mvp.smx`）相关。
// [l4d2_playstats.smx + survivor_mvp]
// [注] 强制 `sm_survivor_mvp_brevity = 0`：MVP 聊天报告的精简 flag（插件 = Survivor MVP notification，`optional/survivor_mvp.sp:268`，默认 0）：`1` 隐藏特感、`2` 隐藏普感、`4` 隐藏友伤、`8` 隐藏排名、`32` 隐藏百分比、`64` 隐藏绝对值；此处 = 0（不精简）。
confogl_addcvar sm_survivor_mvp_brevity 0
// [注] 强制 `sm_survivor_mvp_brevity_latest = 111`：同类 MVP 报告精简 flag（插件 = Player Statistics，`optional/l4d2_playstats.sp:519`，默认 4），位含义同上：`1`+`2`+`4`+`8`+`32`+`64` = 111，即把清单列出的全部内容都隐藏。
confogl_addcvar sm_survivor_mvp_brevity_latest 111
// [注] 强制 `sm_stats_autoprint_vs_round = 8372`：插件 = Player Statistics（`optional/l4d2_playstats.sp:526`，清单默认 8325，范围 ≥ 0.0）。清单对该 ConVar 的「作用」原文即「源码未说明（ConVar 名为 sm_stats_autoprint_vs_round，源码未给描述）」→ 未找到说明（取值 8372）。
confogl_addcvar sm_stats_autoprint_vs_round 8372
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面一条属于 Skill Detection (skeets, crowns, levels)。
// [l4d2_skill_detect.smx]
// [注] 强制 `sm_skill_report_enable = 1`：是否在聊天中播报技巧检测结果；`1` = 播报（插件默认 0）。
confogl_addcvar sm_skill_report_enable 1
// [注] 空行：分隔插件配置与共享设置引入。

