// [注] 强制 `l4d2_rock_trace_unblock_flag = 1`：阻止特感挡住石头半径检测的位掩码（插件默认 5，范围 0~31）；清单列出低位含义：`1` 所有站立的特感、`2` 扑中的特感（清单描述在此被截断）；`1` = 仅"所有站立的特感"。
