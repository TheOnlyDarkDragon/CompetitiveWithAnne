// [注] 强制 `tank_punch_getup_scale = 0.5`：坦克拳击后落地起身动画长度的缩放比例（默认 0.5，范围 0.01~0.99）。行内注释给出换算：54 帧 / 30 fps × 0.5 = 0.9 秒。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「l4d_static_punch_getup.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
