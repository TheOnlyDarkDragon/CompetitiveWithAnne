// [注] 原文注释（原文保留不动）：分组标题——下面三条属于插件 `fixes/l4d_prop_touching_rules.sp`（[L4D & 2] Prop Touching Rules）。
// [l4d_prop_touching_rules.smx]
// [注] 强制 `prop_moveaway_mass_thres = 150.0`：允许被推开的中等重量道具的质量上限，仅在 `prop_touching_moveaway` 开启时生效（插件默认 900.0，范围 ≥ 0.0）。行内注释说明该值可覆盖大多数非致命可击打物（如 cs_assault/HandTruck.mdl）。
confogl_addcvar prop_moveaway_mass_thres 150.0			// Should cover most non-lethal hittables (i.e. cs_assault/HandTruck.mdl)
// [注] 强制 `prop_touching_moveaway = 1`：是否在触碰时推开中等重量道具；`1` = 开启（行内注释：仍允许推开小型道具）。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「l4d_prop_touching_rules.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
confogl_addcvar prop_touching_moveaway 1				// Still allow moving away small props
// [注] 强制 `prop_heavy_touching_move_above = 0`：是否阻止玩家被推上重型道具上方，位掩码 `0` 关闭 / `1` 生还者 / `2` 除坦克外的特感 / `4` 坦克 / `7` 全部；此处 = 0（不阻止）。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「l4d_prop_touching_rules.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
confogl_addcvar prop_heavy_touching_move_above 0
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面两条属于 Uncommon Infected Blocker。
// [l4d2_uncommon_blocker.smx]
// [注] 强制 `sm_uncinfblock_enabled = 1`：是否启用非常见感染者屏蔽插件；`1` = 启用。
confogl_addcvar sm_uncinfblock_enabled 1
// [注] 强制 `sm_uncinfblock_flags = 127`：屏蔽哪些非常见感染者的位掩码（插件默认 55，范围 1~127）；清单列出低位含义：`1` ceda、`2` 泥人、`4` 工兵、`8` fallen、`16` 防暴警、`32` 小丑（清单描述在此被截断），`127` = 全部位开启。
confogl_addcvar sm_uncinfblock_flags 127
// [注] 空行：分隔插件分组。

// [注] 原文注释（原文保留不动）：分组标题——下面两条属于 Infected Warp。
// [l4d2_ghost_warp.smx]
// [注] 强制 `l4d2_ghost_warp_flag = 1`：幽灵传送的启用方式（插件默认 3）：`0` 禁用、`1` 仅通过 `sm_warpto` 命令启用、`2` 通过 `IN_ATTACK2` 按键启用；`1` = 仅命令启用（与行内注释一致）。
confogl_addcvar l4d2_ghost_warp_flag 1 // Enable ghost warp with command only 'sm_warp'
// [注] 强制 `l4d2_ghost_warp_delay = 0.45`：幽灵传送的重用间隔秒数（默认 0.45，范围 0.0~120.0），`0.0` 表示无延迟，最大 120。（来源：本行属于上方分组的插件设置；对应分组标题见原文注释「l4d2_ghost_warp.smx」，该插件在 docs/plugin-commands-and-convars.md 中的 ConVar 表即为本 ConVar 的注册来源。）
confogl_addcvar l4d2_ghost_warp_delay 0.45
// [注] 空行：分隔插件分组。

