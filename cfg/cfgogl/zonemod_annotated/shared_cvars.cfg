// [注] 原文注释（原文保留不动）：分节标题——服务器端设置。
// Server Cvars
// [注] sv_pure = 2（直接设置，非 confogl_addcvar）：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：服务器文件纯净模式等级；设为 2 = 严格（只允许官方与白名单文件）。
sv_pure 2
// [注] sv_alltalk = 0（直接设置，非 confogl_addcvar）：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：全局语音开关（是否所有玩家互相可听）；设为 0 表示关闭，仅本队可听。
sv_alltalk 0
// [注] 强制 sv_cheats = 0：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：是否允许使用作弊指令；设为 0 表示关闭。
confogl_addcvar sv_cheats 0
// [注] 强制 sv_consistency = 1：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：是否对客户端文件做一致性校验；设为 1 表示开启。引擎 ConVar；清单中只在插件「sv_consistency fixes」（`fixes/sv_consistency_fix.sp`，用途「Fixes multiple sv_consistency issues.」）里作为背景出现，无该 ConVar 的语义记载。
confogl_addcvar sv_consistency 1
// [注] 强制 sv_pure_kick_clients = 1：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：纯净模式校验失败时是否踢出客户端；设为 1 表示踢出。
confogl_addcvar sv_pure_kick_clients 1
// [注] 强制 sv_voiceenable = 1：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：语音功能总开关；设为 1 表示开启。
confogl_addcvar sv_voiceenable 1
// [注] 强制 sv_log_onefile = 0：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：是否把服务器日志写入单一文件；设为 0 表示每局/每图单独写日志。
confogl_addcvar sv_log_onefile 0
// [注] 强制 sv_logbans = 1：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：是否把封禁/踢出记录写入日志；设为 1 表示记录。
confogl_addcvar sv_logbans 1
// [注] 原文注释（原文保留不动）：整行被注释掉（不生效）。原意是强制 `sv_allow_lobby_connect_only = 0`（允许非大厅直连），现由下方 `l4d2_lmm_unreserve_type` 等方式处理。
// confogl_addcvar sv_allow_lobby_connect_only 0
// [注] 强制 vs_max_team_switches = 9999：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：对抗模式中允许的队伍切换次数上限；设为 9999 ≈ 不限制。
confogl_addcvar vs_max_team_switches 9999
// [注] 强制 versus_marker_num = 0：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：对抗模式流程标记（versus marker）的显示数量；设为 0 表示不显示。
confogl_addcvar versus_marker_num 0
// [注] 空行：分隔 Server Cvars 与 Bandwidth Cvars。

// [注] 原文注释（原文保留不动）：分节标题——带宽/速率设置。
// Bandwidth Cvars
// [注] 执行 `cfg/confogl_rates.cfg`（仓库中存在，1207 字节）：Confogl 的客户端带宽 / rate 相关配置。
exec confogl_rates.cfg
// [注] 空行：分隔 Bandwidth Cvars 与 ReadyUp Cvars。

// [注] 原文注释（原文保留不动）：分节标题——ReadyUp（准备阶段）参数。
// ReadyUp Cvars
// [注] ReadyUp 总开关，直接设置。ReadyUp 插件（`optional/readyup.sp`）定义于 `optional/readyup/setup.inc:50`：取值 `0` 禁用 / `1` 手动准备 / `2` 自动开始 / `3` 队伍准备；此处 = 1，启用（手动准备）。
l4d_ready_enabled 1
// [注] 空行：分隔 ReadyUp 总开关与具体参数。

// [注] 强制 `l4d_ready_survivor_freeze = 0`。来源 `optional/readyup/setup.inc:57`：「Freeze the survivors during ready-up. When unfrozen they are unable to leave the saferoom but can move freely inside」。取值 `0` = 准备阶段不冻结生还者（解冻后仍不能离开安全屋，但可在屋内自由移动）。
confogl_addcvar l4d_ready_survivor_freeze 0
// [注] 强制 `l4d_ready_delay = 3`。来源 `optional/readyup/setup.inc:69`：「Number of seconds to count down before the round goes live.」= 回合正式开始前的倒计时秒数，此处 3 秒。
confogl_addcvar l4d_ready_delay 3
// [注] 强制 `l4d_ready_enable_sound = 1`。来源 `optional/readyup/setup.inc:60`：「Enable sounds played to clients」= 是否向客户端播放准备阶段音效；`1` = 开启。
confogl_addcvar l4d_ready_enable_sound 1
// [注] 强制 `l4d_ready_chuckle = 0`。来源 `optional/readyup/setup.inc:65`：「Enable random moustachio chuckle during countdown」= 倒计时期间是否随机播放 moustachio 笑声；`0` = 关闭。
confogl_addcvar l4d_ready_chuckle 0
// [注] 强制 `l4d_ready_live_sound = "ui/survival_medal.wav"`。来源 `optional/readyup/setup.inc:63`：「The sound that plays when a round goes live」= 回合正式开始时播放的音效文件；此处指定为 `ui/survival_medal.wav`。
confogl_addcvar l4d_ready_live_sound "ui/survival_medal.wav"
// [注] 强制 `coinflip_delay = -1`。插件 = Coinflip（`optional/coinflip.sp`，`coinflip.sp:43`，默认 `-1`）：两次允许投硬币之间的延迟秒数，-1 表示无延迟。
confogl_addcvar coinflip_delay -1
// [注] 强制 `teamflip_delay = -1`。插件 = Teamflip（`optional/teamflip.sp`，`teamflip.sp:49`，默认 `-1`，范围 ≥ -1.0）：两次允许换队之间的延迟秒数，-1 表示无延迟。
confogl_addcvar teamflip_delay -1
// [注] 空行：分隔 ReadyUp Cvars 与 Config Cvars。

// [注] 原文注释（原文保留不动）：分节标题——Confogl 的比赛流程配置。
// Config Cvars
// [注] 直接设置 `confogl_match_execcfg_off = "confogl_off.cfg"`：比赛模式结束时执行的 cfg 文件（即本文档 3.2 节）。插件 = Confogl's Competitive Mod（`confoglcompmod.sp`，源 `ReqMatch.sp:59`，默认 `confogl_off.cfg`）。
confogl_match_execcfg_off           "confogl_off.cfg"               // Execute this config file upon match mode ends.
// [注] 直接设置 `confogl_match_execcfg_on = "confogl.cfg"`：比赛模式开始及之后每张图执行的 cfg 文件（即本文档 3.1 节）。插件 = Confogl's Competitive Mod（源 `ReqMatch.sp:56`，默认 `confogl.cfg`）。
confogl_match_execcfg_on            "confogl.cfg"                   // Execute this config file upon match mode starts.
// [注] 直接设置 `confogl_match_killlobbyres = "0"`：比赛开始后是否清除大厅预留（lobby reservation）；`0` = 不清除。插件 = Confogl's Competitive Mod（源 `UnreserveLobby.sp:13`，清单默认值 `1`）。
confogl_match_killlobbyres          "0"                             // Sets whether the plugin will clear lobby reservation once a match have begun
// [注] 强制 `l4d2_lmm_unreserve_type = 0`。插件 = L4D2 Lobby match manager（`l4d2_lobby_match_manager.sp:104`，默认 `0`）：大厅预留处理方式；清单原文字面为「直接加入不创建预留：0 保留原有预留，1 Anne 模式下保留原预留至其他情况」（清单描述在此被截断），行内注释则说明 `0` = 保留大厅预留、玩家可投票移除。
confogl_addcvar l4d2_lmm_unreserve_type 0                           // Keep lobby reservation; players can vote to remove it.
// [注] 直接设置 `confogl_match_restart = "1"`：强制或请求进入比赛模式时是否重开地图；`1` = 重开。插件 = Confogl's Competitive Mod（源 `ReqMatch.sp:52`，默认 `1`）。
confogl_match_restart               "1"                             // Sets whether the plugin will restart the map upon match mode being forced or requested
// [注] 空行：分隔 Config Cvars 与 Confogl Cvars。

// [注] 原文注释（原文保留不动）：分节标题——Confogl 本体行为。
// Confogl Cvars
// [注] 强制 `confogl_boss_tank = "1"`。语义由行内注释给出：`1` 时坦克在玩家接管前不能被点燃/冻结/处于幽灵状态，含拳击修复，且 AI 坦克等待玩家期间不投石头。该 ConVar 未被清单收录（仓库 SourcePawn 源码中无注册记录），故「所属插件」记为 Confogl 本体（`confoglcompmod.smx`）但无清单证据。
confogl_addcvar confogl_boss_tank                   "1"             // Tank can't be prelit, frozen and ghost until player takes over, punch fix, and no rock throw for AI tank while waiting for player
// [注] 强制 `confogl_boss_unprohibit = "0"`：是否允许 boss 在所有地图刷新，即使该地图原本不允许；`0` = 不启用该解禁。插件 = Confogl's Competitive Mod（源 `UnprohibitBosses.sp:16`，清单默认 `1`）。
confogl_addcvar confogl_boss_unprohibit             "0"             // Enable bosses spawning on all maps, even through they normally aren't allowed
// [注] 强制 `confogl_lock_boss_spawns = "1"`：强制 Tank 与 Witch 在相同坐标刷新（终局中的坦克除外）。插件 = Confogl's Competitive Mod（源 `BossSpawning.sp:36`，默认 `1`）。
confogl_addcvar confogl_lock_boss_spawns            "1"             // Enables forcing same coordinates for tank and witch spawns (excluding tanks during finales)
// [注] 强制 `confogl_remove_escape_tank = "1"`：移除终局救援载具到来时刷出的坦克。插件 = Confogl's Competitive Mod（源 `GhostTank.sp:45`，默认 `1`）。
confogl_addcvar confogl_remove_escape_tank          "1"             // Removes tanks which spawn as the rescue vehicle arrives on finales
// [注] 强制 `confogl_disable_tank_hordes = "1"`：坦克在场时禁止自然尸潮。插件 = Confogl's Competitive Mod（源 `GhostTank.sp:46`，清单默认 `0`）。
confogl_addcvar confogl_disable_tank_hordes         "1"             // Disables natural hordes while tanks are in play
// [注] 强制 `confogl_block_punch_rock = "0"`：是否禁止坦克同时拳击与投掷石头；`0` = 不禁止。插件 = Confogl's Competitive Mod（源 `GhostTank.sp:47`，默认 `0`）。
confogl_addcvar confogl_block_punch_rock            "0"             // Block tanks from punching and throwing a rock at the same time
// [注] 强制 `confogl_blockinfectedbots = "0"`。语义由行内注释给出：阻止特感 bot 加入游戏（坦克刷新时除外，以便玩家先刷出 AI 特感再接管坦克）；`0` = 不阻止。该 ConVar 未被清单收录（源码中无注册记录）。
confogl_addcvar confogl_blockinfectedbots           "0"             // Blocks infected bots from joining the game, minus when a tank spawns (allows players to spawn a AI infected first before taking control of the tank)
// [注] 强制 director_allow_infected_bots = "0"：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：导演是否允许 AI 感染者 Bot 加入对局；设为 0 表示禁止。仓库源码证据：optional/l4d2_fix_spawn_order.sp:66 以 FindConVar("director_allow_infected_bots") 读取其开关值（同插件 178/350/376/388 行判断 BoolValue）。
confogl_addcvar director_allow_infected_bots        "0"
// [注] 强制 `confogl_reduce_finalespawnrange = "1"`：把终局的特感刷新范围调整为普通刷新范围。插件 = Confogl's Competitive Mod（源 `FinaleSpawn.sp:19`，默认 `1`）。
confogl_addcvar confogl_reduce_finalespawnrange     "1"             // Adjust the spawn range on finales for infected, to normal spawning range
// [注] 强制 `confogl_remove_chainsaw = "1"`：移除所有电锯。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:584`，默认 `1`）。
confogl_addcvar confogl_remove_chainsaw             "1"             // Remove all chainsaws
// [注] 强制 `confogl_remove_defib = "1"`：移除所有除颤器。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:588`，默认 `1`）。
confogl_addcvar confogl_remove_defib                "1"             // Remove all defibrillators
// [注] 强制 `confogl_remove_grenade = "1"`：移除所有榴弹发射器。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:583`，默认 `1`）。
confogl_addcvar confogl_remove_grenade              "1"             // Remove all grenade launchers
// [注] 强制 `confogl_remove_m60 = "1"`：移除所有 M60 机枪。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:585`，默认 `1`）。
confogl_addcvar confogl_remove_m60                  "1"             // Remove all M60 rifles
// [注] 强制 `confogl_remove_lasersight = "1"`：移除所有激光瞄准升级。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:608`，默认 `1`）。
confogl_addcvar confogl_remove_lasersight           "1"             // Remove all laser sight upgrades
// [注] 强制 `confogl_remove_saferoomitems = "1"`：移除安全屋内除医疗包以外的额外物品（槽位 3、4、5 的物品）。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:609`，默认 `1`）。
confogl_addcvar confogl_remove_saferoomitems        "1"             // Remove all extra items inside saferooms (items for slot 3, 4 and 5, minus medkits)
// [注] 强制 `confogl_remove_upg_explosive = "1"`：移除所有高爆弹药包。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:589`，默认 `1`）。
confogl_addcvar confogl_remove_upg_explosive        "1"             // Remove all explosive upgrade packs
// [注] 强制 `confogl_remove_upg_incendiary = "1"`：移除所有燃烧弹药包。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:590`，默认 `1`）。
confogl_addcvar confogl_remove_upg_incendiary       "1"             // Remove all incendiary upgrade packs
// [注] 强制 `confogl_replace_cssweapons = "0"`：是否把 CSS 武器替换为普通 L4D2 武器；`0` = 不替换。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:577`，清单默认 `1`）。
confogl_addcvar confogl_replace_cssweapons          "0"             // Replace CSS weapons with normal L4D2 weapons
// [注] 强制 `confogl_replace_startkits = "0"`：是否把起点的医疗包替换为止痛药；`0` = 不替换。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:606`，清单默认 `1`）。
confogl_addcvar confogl_replace_startkits           "0"             // Replace medkits at mission start with pain pills
// [注] 强制 `confogl_replace_finalekits = "1"`：把终局的医疗包替换为止痛药。插件 = Confogl's Competitive Mod（源 `WeaponInformation.sp:607`，默认 `1`）。
confogl_addcvar confogl_replace_finalekits          "1"             // Replace medkits during finale with pain pills
// [注] 强制 `confogl_waterslowdown = "0"`：是否让水额外减速生还者 10%；`0` = 关闭。插件 = Confogl's Competitive Mod（源 `WaterSlowdown.sp:22`，清单默认 `1`）。
confogl_addcvar confogl_waterslowdown               "0"             // Sets whether water will slowdown the survivors by another 10%
// [注] 强制 `confogl_enable_itemtracking = "1"`：启用物品跟踪模块，用于控制与限制物品刷新；物量上限从 Cvar 与 `mapinfo.txt` 读取，并以 `mapinfo.txt` 为优先。插件 = Confogl's Competitive Mod（源 `ItemTracking.sp:164`，清单默认 `0`）。
confogl_addcvar confogl_enable_itemtracking         "1"             // Enable the itemtracking module, which controls and limits item spawns. Item Limits will be read from Cvars and mapinfo.txt, with preferences to mapinfo settings
// [注] 强制 `confogl_itemtracking_savespawns = "1"`：让两回合的物品刷新保持一致（记录第 1 回合并在第 2 回合复现）。插件 = Confogl's Competitive Mod（源 `ItemTracking.sp:165`，清单默认 `0`）。
confogl_addcvar confogl_itemtracking_savespawns     "1"             // Keep item spawns the same on both rounds. Item spawns will be remembered from round1 and reproduced on round2.
// [注] 强制 `confogl_itemtracking_mapspecific = "3"`：`mapinfo.txt` 覆盖方式（清单原文：`0` 忽略该文件、`1` 允许减少上限、`2` 允许提高上限；清单未说明 `3`，行内注释说明本行意图是允许 `mapinfo.txt` 覆盖 Cvar 上限）。插件 = Confogl's Competitive Mod（源 `ItemTracking.sp:166`，清单默认 `0`，清单范围 0~3）。
confogl_addcvar confogl_itemtracking_mapspecific    "3"             // Allow ConVar limits to be overridden by mapinfo.txt limits
// [注] 强制 confogl_adrenaline_limit = "0"：限制每张图安全屋外肾上腺素（adrenaline shots）的数量；-1 = 不限制，>=0 = 限制为该值，此处 = 0（安全屋外不允许出现该物品）。来源：Confogl（confoglcompmod）的 ItemTracking 模块在 confoglcompmod/ItemTracking.sp:188 用 FormatEx("%s_limit", …) 动态拼接名称后经 CreateConVarEx 注册（前缀 confogl_），故静态清单未收录。
confogl_addcvar confogl_adrenaline_limit            "0"             // Limits the number of adrenaline shots on each map outside of saferooms. -1: no limit; >=0: limit to cvar value
