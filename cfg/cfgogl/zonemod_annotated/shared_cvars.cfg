// [注] 强制 tank_ground_pound_duration = 0.1：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：坦克砸地（ground pound）动作的持续时间（秒）；设为 0.1（大幅缩短）。
confogl_addcvar tank_ground_pound_duration 0.1
// [注] 强制 z_witch_damage_per_kill_hit = 15：引擎 ConVar，插件清单与本仓库源码均无注册记录。推断：女巫每次命中造成的伤害；设为 15。
confogl_addcvar z_witch_damage_per_kill_hit 15
// [注] 空行：分隔 Tank/Witch Cvars 与 Stripper 路径。

// [注] 原文注释（原文保留不动）：分节标题——Stripper:Source 配置路径。
// Stripper Path
// [注] 强制 `stripper_cfg_path = cfg/stripper/zonemod`：把 Stripper:Source 扩展的配置路径指向本配置专用的 `cfg/stripper/zonemod`（该目录在仓库中存在）。`stripper_cfg_path` 属 Stripper:Source 扩展的 ConVar，清单未收录其定义，只在 `l4d2_nav_variant.sp` 的 `l4d2_nav_variant_stripper_path` 描述中被引用为「要求 stripper_cfg_path 等于该路径」。本行是文件最后一行，有结尾换行符。
confogl_addcvar stripper_cfg_path cfg/stripper/zonemod
