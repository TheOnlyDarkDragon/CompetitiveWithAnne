// [注] 执行 `shared_plugins.cfg`（142 行，见本文档 3.5 节）：加载全部共享与通用插件。
exec cfgogl/zonemod/shared_plugins.cfg
// [注] 空行：分隔共享插件与 4v4 专属插件。

