// ZoneMod 4v4
// [注] 原文注释（原文保留不动）：分节框线。
//-------------------------------------------
// [注] SourceMod 核心命令 `sm plugins load <插件文件>`，加载已编译插件 `optional/survivor_mvp.smx`（SourceMod 本体命令来自 `sourcemod/` 目录，清单已声明不收录；下同）。插件用途（清单 myinfo）：Survivor MVP notification —— 「Shows MVP for survivor team at end of round」（回合结束时显示生还者队 MVP）。
sm plugins load optional/survivor_mvp.smx
// [注] 加载 `l4d2_antibaiter.smx`。插件用途：L4D2 Antibaiter —— 「Makes you think twice before attempting to bait that shit」（反挂机/反 baiting）。
sm plugins load optional/l4d2_antibaiter.smx
// [注] 加载 `l4d2_playstats.smx`。插件用途：Player Statistics —— 「Tracks statistics, even when clients disconnect. MVP, Skills, Accuracy, etc.」（统计 MVP、技巧、命中率等，客户端掉线也保留）。
sm plugins load optional/l4d2_playstats.smx
// [注] 加载 `l4d2_skill_detect.smx`。插件用途：Skill Detection (skeets, crowns, levels) —— 「Detects and reports skeets, crowns, levels, highpounces, etc.」（检测并播报 skeet、crown、level、高空扑等技巧）。
sm plugins load optional/l4d2_skill_detect.smx
// [注] 加载 `autopause.smx`。插件用途：L4D2 Auto-pause —— 「When a player disconnects due to crash, automatically pause the game. When they rejoin, give them a correct spawn timer.」（玩家崩溃掉线时自动暂停，重连后给出正确的刷新计时）。
sm plugins load optional/autopause.smx
// [注] 加载 `l4d2_tongue_timer.smx`。插件用途：Tongue Timer —— 「Modify the Smoker's tongue ability timer in certain scenarios.」（在特定情形下修改 Smoker 舌头冷却计时）。本行是文件最后一行，有结尾换行符。
sm plugins load optional/l4d2_tongue_timer.smx
