// Disable ReadyUp
// [注] ReadyUp 总开关，直接设置。由 ReadyUp 插件（`optional/readyup.sp`）提供，定义于 `optional/readyup/setup.inc:50`：`CreateConVar("l4d_ready_enabled", "1", "Enable this plugin. (Values: 0 = Disabled, 1 = Manual ready, 2 = Auto start, 3 = Team ready)", FCVAR_NONE, true, 0.0, true, 3.0)`。取值含义：`0` 禁用 / `1` 手动准备 / `2` 自动开始 / `3` 队伍准备；此处 = 0，关闭 ReadyUp。（定义在 `.inc` 中，故清单未收录。）
l4d_ready_enabled 0
// [注] 空行：分隔 Disable ReadyUp 与复位分节。

// [注] 原文注释（原文保留不动）：分节标题——复位普感上限、静态刷新点与文本计数。
